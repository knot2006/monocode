name: Fork Release

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. fork-v0.16.0). Defaults to fork-v<version> from tauri.conf.json."
        required: false
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      updater_endpoint: ${{ steps.meta.outputs.updater_endpoint }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate secrets and resolve release metadata
        id: meta
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const missingSecrets = [];
          if (!(process.env.TAURI_UPDATER_PUBKEY || "").trim()) {
            missingSecrets.push("TAURI_UPDATER_PUBKEY");
          }
          if (!(process.env.TAURI_SIGNING_PRIVATE_KEY || "").trim()) {
            missingSecrets.push("TAURI_SIGNING_PRIVATE_KEY");
          }
          if (missingSecrets.length > 0) {
            console.error(`Missing required repository secrets: ${missingSecrets.join(", ")}`);
            process.exit(1);
          }

          const confVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const pkgVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const cargoToml = fs.readFileSync("Cargo.toml", "utf8");
          const workspaceMatch = cargoToml.match(/\[workspace\.package\][\s\S]*?^version\s*=\s*"([^"]+)"/m);
          const cargoVersion = workspaceMatch ? workspaceMatch[1] : "";

          if (!confVersion || !pkgVersion || !cargoVersion) {
            console.error("Failed to read version from src-tauri/tauri.conf.json, package.json, or Cargo.toml");
            process.exit(1);
          }

          const inputTag = (process.env.INPUT_TAG || "").trim();
          const tagName =
            process.env.GITHUB_EVENT_NAME === "push"
              ? process.env.GITHUB_REF_NAME
              : inputTag || `fork-v${confVersion}`;

          if (!tagName.startsWith("fork-v")) {
            console.error(`Release tag must start with "fork-v", got: ${tagName}`);
            process.exit(1);
          }

          const version = tagName.slice("fork-v".length);
          if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(version)) {
            console.error(`Invalid release version "${version}" derived from tag "${tagName}"`);
            process.exit(1);
          }

          if (version !== confVersion || version !== pkgVersion || version !== cargoVersion) {
            console.error(
              `Tag ${tagName} (${version}) does not match package.json (${pkgVersion}), Cargo.toml (${cargoVersion}), or src-tauri/tauri.conf.json (${confVersion})`,
            );
            process.exit(1);
          }

          const prerelease = process.env.INPUT_PRERELEASE === "true" || version.includes("-");
          const updaterEndpoint = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/latest.json`;

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `tag_name=${tagName}`,
              `version=${version}`,
              `prerelease=${prerelease}`,
              `updater_endpoint=${updaterEndpoint}`,
            ].join("\n") + "\n",
          );
          NODE

  windows:
    name: Windows packages
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Write updater release config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINT: ${{ needs.prepare.outputs.updater_endpoint }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBKEY)) {
            throw "TAURI_UPDATER_PUBKEY is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_ENDPOINT)) {
            throw "TAURI_UPDATER_ENDPOINT is required"
          }
          $config = @{
            bundle = @{
              createUpdaterArtifacts = $true
            }
            plugins = @{
              updater = @{
                pubkey = $env:TAURI_UPDATER_PUBKEY
                endpoints = @($env:TAURI_UPDATER_ENDPOINT)
              }
            }
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\tauri.release.conf.json"

      - name: Build Windows packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $env:RUSTUP_TOOLCHAIN = "stable-x86_64-pc-windows-msvc"
          npx tauri build --bundles nsis --config "$env:RUNNER_TEMP\tauri.release.conf.json"

      - name: Stage Windows packages
        run: |
          $installers = @(Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe")
          $signatures = @(Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe.sig")
          if ($installers.Count -ne 1 -or $signatures.Count -ne 1) {
            throw "Expected exactly one NSIS installer and one updater signature"
          }
          New-Item -ItemType Directory -Force "release-artifacts" | Out-Null
          $artifacts = @($installers[0].FullName, $signatures[0].FullName)
          Copy-Item -Path $artifacts -Destination "release-artifacts/"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release-artifacts/
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: bash scripts/install-linux-deps-debian.sh

      - run: npm ci

      - name: Write updater release config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINT: ${{ needs.prepare.outputs.updater_endpoint }}
        run: |
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const pubkey = process.env.TAURI_UPDATER_PUBKEY || "";
          const endpoint = process.env.TAURI_UPDATER_ENDPOINT || "";
          if (!pubkey || !endpoint) {
            console.error("TAURI_UPDATER_PUBKEY and an updater endpoint are required");
            process.exit(1);
          }
          writeFileSync(
            process.env.RUNNER_TEMP + "/tauri.release.conf.json",
            JSON.stringify(
              { plugins: { updater: { pubkey, endpoints: [endpoint] } } },
              null,
              2,
            ),
          );
          NODE

      # Same as `npm run build:linux`, with the updater config merged in.
      # npm would append extra args to the repack script, not tauri build.
      - name: Build Linux packages
        run: |
          set -euo pipefail
          npx tauri build --bundles deb,appimage --config "$RUNNER_TEMP/tauri.release.conf.json"
          bash scripts/repack-appimage.sh

      - name: Assert AppImage uses host libraries
        run: bash scripts/assert-appimage-host-libs.sh

      # Sign after repack-appimage.sh: a signature Tauri wrote during the
      # build would cover the pre-repack file and fail updater verification.
      - name: Sign AppImage for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimage=(target/release/bundle/appimage/*.AppImage)
          if (( ${#appimage[@]} != 1 )); then
            echo "Expected exactly one AppImage" >&2
            exit 1
          fi
          npx tauri signer sign "${appimage[0]}"
          test -s "${appimage[0]}.sig"

      - name: Stage Linux packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          deb=(target/release/bundle/deb/*.deb)
          appimage=(target/release/bundle/appimage/*.AppImage)
          if (( ${#deb[@]} != 1 || ${#appimage[@]} != 1 )); then
            echo "Expected exactly one .deb and one AppImage" >&2
            exit 1
          fi
          if [[ ! -s "${appimage[0]}.sig" ]]; then
            echo "Missing AppImage updater signature" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "${deb[0]}" "${appimage[0]}" "${appimage[0]}.sig" release-artifacts/

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-artifacts/
          if-no-files-found: error

  linux-rpm:
    name: Linux rpm package
    needs: prepare
    runs-on: ubuntu-latest
    # Build on EL 10 so the published rpm's glibc requirement matches the
    # oldest advertised target. Fedora 43 is newer and would install on EL 10
    # while failing to load.
    container: almalinux:10
    steps:
      # almalinux:10 ships no git, which actions/checkout otherwise has to work
      # around with a REST API tarball download.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Enterprise Linux system dependencies
        run: bash scripts/install-linux-deps-fedora.sh

      - run: npm ci

      - name: Build rpm package
        run: npm run build:fedora

      - name: Install and stage the generated rpm
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(target/release/bundle/rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          # tauri-bundler derives rpm Requires only from
          # bundle.linux.rpm.depends, and the setup script has already
          # installed every -devel package, so assert the metadata directly.
          requires="$(rpm -qp --requires "${bundle[0]}")"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3 librsvg2 openssl-libs; do
            if ! grep -qx "$dep" <<<"$requires"; then
              echo "rpm is missing Requires: $dep" >&2
              exit 1
            fi
          done
          dnf install -y "${bundle[0]}"
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          mkdir -p release-artifacts
          cp "${bundle[0]}" release-artifacts/

      - name: Upload rpm package
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-package
          path: release-artifacts/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, windows, linux, linux-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: artifacts/windows

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: artifacts/linux

      - name: Download Linux rpm package
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm-package
          path: artifacts/rpm

      - name: Generate updater manifest and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          EXES=(artifacts/windows/*.exe)
          EXE_SIGS=(artifacts/windows/*.exe.sig)
          DEBS=(artifacts/linux/*.deb)
          APPIMAGES=(artifacts/linux/*.AppImage)
          APPIMAGE_SIGS=(artifacts/linux/*.AppImage.sig)
          RPMS=(artifacts/rpm/*.rpm)

          if (( ${#EXES[@]} != 1 || ${#EXE_SIGS[@]} != 1 )); then
            echo "Expected exactly one Windows installer and one updater signature" >&2
            exit 1
          fi
          if (( ${#DEBS[@]} != 1 || ${#APPIMAGES[@]} != 1 || ${#APPIMAGE_SIGS[@]} != 1 )); then
            echo "Expected exactly one .deb, one AppImage, and one AppImage signature" >&2
            exit 1
          fi
          if (( ${#RPMS[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi

          EXE="${EXES[0]}"
          EXE_SIG="${EXE_SIGS[0]}"
          DEB="${DEBS[0]}"
          APPIMAGE="${APPIMAGES[0]}"
          APPIMAGE_SIG="${APPIMAGE_SIGS[0]}"
          RPM="${RPMS[0]}"

          EXE_SIG="$EXE_SIG" \
          EXE_NAME="$(basename "$EXE")" \
          APPIMAGE_SIG="$APPIMAGE_SIG" \
          APPIMAGE_NAME="$(basename "$APPIMAGE")" \
          node <<'NODE'
          const fs = require("node:fs");

          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG_NAME}`;
          const manifest = {
            version: process.env.VERSION,
            notes: `MonoCode ${process.env.VERSION}`,
            pub_date: new Date().toISOString(),
            platforms: {
              "windows-x86_64": {
                signature: fs.readFileSync(process.env.EXE_SIG, "utf8").trim(),
                url: `${base}/${encodeURIComponent(process.env.EXE_NAME)}`,
              },
              // AppImage only: the installer-specific key keeps .deb and
              // .rpm installs (which have no `linux-x86_64` entry) on
              // their package manager instead of self-updating.
              "linux-x86_64-appimage": {
                signature: fs.readFileSync(process.env.APPIMAGE_SIG, "utf8").trim(),
                url: `${base}/${encodeURIComponent(process.env.APPIMAGE_NAME)}`,
              },
            },
          };

          fs.writeFileSync("artifacts/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          NODE

          RELEASE_FILES=(
            "$EXE"
            "$EXE_SIG"
            "$DEB"
            "$APPIMAGE"
            "$APPIMAGE_SIG"
            "$RPM"
            "artifacts/latest.json"
          )

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --draft \
              --prerelease="$PRERELEASE" \
              --title "MonoCode $VERSION" \
              --generate-notes
          fi

          verify_release() {
            local expected_draft="$1"
            gh release view "$TAG_NAME" --json isDraft,isPrerelease,assets > "$RUNNER_TEMP/release-state.json"
            node - "$RUNNER_TEMP/release-state.json" "$expected_draft" "${RELEASE_FILES[@]}" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const release = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (release.isDraft !== (process.argv[3] === "true")) {
            console.error("GitHub Release publication state is unexpected.");
            process.exit(1);
          }
          if (release.isPrerelease !== (process.env.PRERELEASE === "true")) {
            console.error("GitHub Release channel is unexpected.");
            process.exit(1);
          }
          const names = new Set(release.assets.map((asset) => asset.name));
          for (const file of process.argv.slice(4)) {
            const name = path.basename(file);
            if (!names.has(name)) {
              console.error(`GitHub Release is missing ${name}.`);
              process.exit(1);
            }
          }
          NODE
          }

          IS_DRAFT=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)
          if [[ "$IS_DRAFT" == true ]]; then
            # Draft assets can be replaced after an interrupted upload. A
            # published release is immutable, so only resume drafts.
            gh release upload "$TAG_NAME" "${RELEASE_FILES[@]}" --clobber
            verify_release true
            gh release edit "$TAG_NAME" --draft=false --prerelease="$PRERELEASE"
          elif [[ "$IS_DRAFT" != false ]]; then
            echo "Unexpected GitHub Release state: $IS_DRAFT" >&2
            exit 1
          fi
          verify_release false

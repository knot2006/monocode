name: Fork Release (GPUI)

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. fork-v0.16.0-preview.1). Defaults to fork-v<version>-preview.<run_number>."
        required: false
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease (skips /releases/latest updater feed)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      updater_endpoint: ${{ steps.meta.outputs.updater_endpoint }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate secrets and resolve release metadata
        id: meta
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { previewVersion } from "./scripts/package-native.mjs";

          const missingSecrets = [];
          if (!(process.env.TAURI_UPDATER_PUBKEY || "").trim()) {
            missingSecrets.push("TAURI_UPDATER_PUBKEY");
          }
          if (!(process.env.TAURI_SIGNING_PRIVATE_KEY || "").trim()) {
            missingSecrets.push("TAURI_SIGNING_PRIVATE_KEY");
          }
          if (missingSecrets.length > 0) {
            console.error(`Missing required repository secrets: ${missingSecrets.join(", ")}`);
            process.exit(1);
          }

          const cargoToml = fs.readFileSync("Cargo.toml", "utf8");
          const workspaceMatch = cargoToml.match(/\[workspace\.package\][\s\S]*?^version\s*=\s*"([^"]+)"/m);
          const baseVersion = workspaceMatch ? workspaceMatch[1] : "";
          if (!baseVersion) {
            console.error("Failed to read [workspace.package] version from Cargo.toml");
            process.exit(1);
          }

          const inputTag = (process.env.INPUT_TAG || "").trim();
          const tagName =
            process.env.GITHUB_EVENT_NAME === "push"
              ? process.env.GITHUB_REF_NAME
              : inputTag || `fork-v${baseVersion}-preview.${process.env.GITHUB_RUN_NUMBER}`;

          if (!tagName.startsWith("fork-v")) {
            console.error(`Release tag must start with "fork-v", got: ${tagName}`);
            process.exit(1);
          }

          const version = tagName.slice("fork-v".length);
          previewVersion(version);

          const prerelease = process.env.INPUT_PRERELEASE === "true";
          const updaterEndpoint = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/latest.json`;

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `tag_name=${tagName}`,
              `version=${version}`,
              `prerelease=${prerelease}`,
              `updater_endpoint=${updaterEndpoint}`,
            ].join("\n") + "\n",
          );
          NODE

  build:
    name: Native GPUI (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            kind: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            kind: windows
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      MONOCODE_NATIVE_VERSION: ${{ needs.prepare.outputs.version }}
      MONOCODE_NATIVE_UPDATER_ENDPOINT: ${{ needs.prepare.outputs.updater_endpoint }}
      MONOCODE_NATIVE_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          key: fork-native-${{ matrix.target }}
          cache-on-failure: true

      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libx11-xcb-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev squashfs-tools desktop-file-utils
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Install native Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'RUSTFLAGS=-C target-feature=+crt-static' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build optimized native app
        run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-gpui --target ${{ matrix.target }} --release

      - name: Package native app
        shell: bash
        run: |
          set -euo pipefail
          BINARY="crates/monocode-gpui/target/${{ matrix.target }}/release/monocode-gpui"
          if [ "$RUNNER_OS" = Windows ]; then BINARY="$BINARY.exe"; fi
          node scripts/package-native.mjs '${{ matrix.kind }}' "$BINARY" native-dist '${{ matrix.arch }}'

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            native-dist/*.json
            native-dist/*.AppImage
            native-dist/*.deb
            native-dist/*.exe
          if-no-files-found: error

  rpm:
    name: Native GPUI (Enterprise Linux rpm)
    needs: prepare
    runs-on: ubuntu-latest
    container: almalinux:10
    env:
      CARGO_BUILD_JOBS: 2
      MONOCODE_NATIVE_VERSION: ${{ needs.prepare.outputs.version }}
      MONOCODE_NATIVE_UPDATER_ENDPOINT: ${{ needs.prepare.outputs.updater_endpoint }}
      MONOCODE_NATIVE_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native rpm build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf install -y clang gcc-c++ cmake ninja-build pkgconf-pkg-config fontconfig-devel freetype-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel alsa-lib-devel libX11-devel libX11-xcb mesa-libEGL-devel vulkan-loader-devel dbus-devel rpm-build perl

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/monocode-gpui
          key: fork-native-linux-rpm
          cache-on-failure: true

      - name: Build optimized native app
        run: cargo build --locked --manifest-path crates/monocode-gpui/Cargo.toml -p monocode-gpui --release

      - name: Package native rpm
        run: node scripts/package-native.mjs rpm crates/monocode-gpui/target/release/monocode-gpui native-dist x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-rpm
          path: |
            native-dist/*.json
            native-dist/*.rpm
          if-no-files-found: error

  release:
    name: Sign and publish GitHub Release
    needs: [prepare, build, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native-dist

      - name: Sign native packages, generate updater manifest, and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { readFileSync, readdirSync, writeFileSync } from "node:fs";
          import { basename, join, resolve } from "node:path";

          const expectedTargets = [
            "windows-x86_64-nsis",
            "linux-x86_64-appimage",
            "linux-x86_64-deb",
            "linux-x86_64-rpm",
          ];

          const directory = resolve("native-dist");
          const sign = (filename) => {
            const result = spawnSync(
              process.execPath,
              ["node_modules/@tauri-apps/cli/tauri.js", "signer", "sign", filename],
              {
                env: {
                  ...process.env,
                  CI: "true",
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
                    process.env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD ?? "",
                },
                encoding: "utf8",
                stdio: ["ignore", "pipe", "pipe"],
              },
            );
            if (result.error || result.status !== 0) {
              console.error(result.stderr || result.stdout || "");
              throw new Error(`Could not sign ${basename(filename)}`);
            }
            return readFileSync(`${filename}.sig`, "utf8").trim();
          };

          const files = [];
          const platforms = {};
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG_NAME}`;

          for (const metadata of readdirSync(directory).filter((name) =>
            /^artifacts-.*\.json$/.test(name),
          )) {
            for (const record of JSON.parse(
              readFileSync(join(directory, metadata), "utf8"),
            )) {
              if (
                basename(record.filename) !== record.filename ||
                record.filename.includes("\\")
              ) {
                throw new Error(`Invalid artifact filename: ${record.filename}`);
              }
              if (files.includes(record.filename)) {
                throw new Error(`Duplicate native artifact: ${record.filename}`);
              }
              files.push(record.filename);
              if (record.target) {
                if (
                  !expectedTargets.includes(record.target) ||
                  platforms[record.target]
                ) {
                  throw new Error(
                    `Duplicate or unexpected native target: ${record.target}`,
                  );
                }
                const filePath = join(directory, record.filename);
                const signature = sign(filePath);
                files.push(`${record.filename}.sig`);
                platforms[record.target] = {
                  url: `${base}/${encodeURIComponent(record.filename)}`,
                  signature,
                };
              }
            }
          }

          for (const target of expectedTargets) {
            if (!platforms[target]) {
              throw new Error(`Missing native package: ${target}`);
            }
          }

          const manifest = {
            app_id: "dev.usemono.gpui",
            channel: "native-preview",
            version: process.env.VERSION,
            notes: `Monocode Native ${process.env.VERSION}`,
            platforms,
          };

          const payload = Buffer.from(JSON.stringify(manifest));
          const payloadPath = join(directory, "native-manifest.payload");
          writeFileSync(payloadPath, payload);
          const signature = sign(payloadPath);
          writeFileSync(
            join(directory, "latest.json"),
            JSON.stringify({ payload: payload.toString("base64"), signature }) + "\n",
          );
          files.push("latest.json");
          writeFileSync(
            join(directory, "release-files.json"),
            JSON.stringify(files, null, 2) + "\n",
          );
          NODE

          mapfile -t RELEASE_NAMES < <(node --input-type=module -e 'import { readFileSync } from "node:fs"; for (const file of JSON.parse(readFileSync("native-dist/release-files.json", "utf8"))) console.log(file);')
          RELEASE_FILES=()
          for name in "${RELEASE_NAMES[@]}"; do
            RELEASE_FILES+=("native-dist/$name")
          done

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --draft \
              --prerelease="$PRERELEASE" \
              --title "Monocode Native $VERSION" \
              --generate-notes
          fi

          verify_release() {
            local expected_draft="$1"
            gh release view "$TAG_NAME" --json isDraft,isPrerelease,assets > "$RUNNER_TEMP/release-state.json"
            node - "$RUNNER_TEMP/release-state.json" "$expected_draft" "${RELEASE_FILES[@]}" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const release = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (release.isDraft !== (process.argv[3] === "true")) {
            console.error("GitHub Release publication state is unexpected.");
            process.exit(1);
          }
          if (release.isPrerelease !== (process.env.PRERELEASE === "true")) {
            console.error("GitHub Release channel is unexpected.");
            process.exit(1);
          }
          const names = new Set(release.assets.map((asset) => asset.name));
          for (const file of process.argv.slice(4)) {
            const name = path.basename(file);
            if (!names.has(name)) {
              console.error(`GitHub Release is missing ${name}.`);
              process.exit(1);
            }
          }
          NODE
          }

          IS_DRAFT=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)
          if [[ "$IS_DRAFT" == true ]]; then
            gh release upload "$TAG_NAME" "${RELEASE_FILES[@]}" --clobber
            verify_release true
            gh release edit "$TAG_NAME" --draft=false --prerelease="$PRERELEASE"
          elif [[ "$IS_DRAFT" != false ]]; then
            echo "Unexpected GitHub Release state: $IS_DRAFT" >&2
            exit 1
          fi
          verify_release false
